name: Windows installer packages
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        edition: [lite, cpu, opencl]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: npm ci
        working-directory: apps/desktop
      - name: Validate release contracts
        run: |
          python scripts/validate_scaffold.py --verbose
          python scripts/validate_release_assets.py --verbose
          python scripts/validate_release_workflow.py --verbose
      - name: Prepare verified KataGo runtime
        run: python scripts/prepare_windows_release.py '${{ matrix.edition }}'
      - name: Build installer
        working-directory: apps/desktop
        run: npm run tauri:build -- --ci --bundles nsis
      - name: Collect installer
        run: python scripts/prepare_windows_release.py '${{ matrix.edition }}' --collect
      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.edition }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7
